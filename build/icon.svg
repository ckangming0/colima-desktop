<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6ff5"/>
      <stop offset="1" stop-color="#1b3fb8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1e66" flood-opacity=".35"/>
    </filter>
    <g id="c">
      <rect x="262" y="0" width="500" height="138" rx="26" fill="url(#box)"/>
      <g stroke="#3b6ff5" stroke-width="16" stroke-linecap="round" opacity=".55">
        <line x1="342" y1="34" x2="342" y2="104"/><line x1="412" y1="34" x2="412" y2="104"/>
        <line x1="482" y1="34" x2="482" y2="104"/><line x1="552" y1="34" x2="552" y2="104"/>
        <line x1="622" y1="34" x2="622" y2="104"/>
      </g>
    </g>
  </defs>
  <!-- macOS icon grid: 824px squircle centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- three stacked shipping containers, centred: 3×138 + 2×26 gaps = 466 tall -->
    <use href="#c" y="279"/>
    <use href="#c" y="443"/>
    <use href="#c" y="607"/>
  </g>
  <!-- running status light -->
  <circle cx="700" cy="348" r="26" fill="#34d058"/>
</svg>
