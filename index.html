<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Colima Desktop</title>
<style>
  :root {
    --text: rgba(0,0,0,.88); --text-2: rgba(0,0,0,.56); --text-3: rgba(0,0,0,.36);
    --sep: rgba(0,0,0,.08); --hover: rgba(0,0,0,.04); --sel: rgba(0,0,0,.07);
    --pane: #fbfbfd; --bar: rgba(251,251,253,.74); --card: #ffffff; --well: #f4f4f6;
    --accent: #0a84ff; --green: #1fa83a; --red: #e5372b; --gray: #8e8e93; --amber: #e08600;
    --hl: rgba(255, 204, 0, .45); --hl-cur: rgba(255, 149, 0, .8);
    --j-key: #9b2393; --j-str: #c41a16; --j-num: #1c00cf; --j-lit: #0b4f79;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: rgba(255,255,255,.9); --text-2: rgba(255,255,255,.58); --text-3: rgba(255,255,255,.36);
      --sep: rgba(255,255,255,.09); --hover: rgba(255,255,255,.045); --sel: rgba(255,255,255,.09);
      --pane: #1e1e20; --bar: rgba(30,30,32,.74); --card: #262628; --well: #161618;
      --green: #32d74b; --red: #ff6961; --amber: #ffb340;
      --hl: rgba(255, 214, 10, .35); --hl-cur: rgba(255, 159, 10, .75);
      --j-key: #ff7ab2; --j-str: #ff8170; --j-num: #d9c97c; --j-lit: #6bdfff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--text);
    background: transparent; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  [hidden] { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-2); }

  /* ---------- sidebar (native vibrancy behind it) ---------- */
  aside { width: 210px; flex: none; display: flex; flex-direction: column; padding: 52px 10px 12px; -webkit-app-region: drag; }
  aside nav, aside .engine { -webkit-app-region: no-drag; }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--text-3); padding: 0 10px 4px; }
  nav button {
    all: unset; display: flex; align-items: center; gap: 9px; width: 100%; box-sizing: border-box;
    padding: 6px 10px; border-radius: 7px; font-weight: 500; color: var(--text);
  }
  nav button:hover { background: var(--hover); }
  nav button[aria-current="true"] { background: var(--sel); }
  nav svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  nav .count { margin-left: auto; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .engine { margin-top: auto; padding: 10px; border-radius: 10px; background: var(--hover); }
  .engine-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .engine-meta { font-size: 11px; color: var(--text-2); margin: 3px 0 9px 16px; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); flex: none; transition: background-color .3s; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
  .dot.busy { background: var(--amber); }

  /* ---------- main pane ---------- */
  main { flex: 1; min-width: 0; background: var(--pane); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--sep); }
  header {
    position: absolute; inset: 0 0 auto 0; z-index: 3; height: 52px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 20px; background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-app-region: drag;
  }
  header::after { content: ""; position: absolute; inset: auto 0 -12px 0; height: 12px; pointer-events: none;
    background: linear-gradient(var(--sep), transparent); opacity: 0; transition: opacity .2s; }
  header.scrolled::after { opacity: .7; }
  header button, header input, header a { -webkit-app-region: no-drag; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spacer { flex: 1; }
  .head-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .field {
    padding: 5px 10px; border-radius: 7px; border: 1px solid var(--sep); background: var(--hover);
    color: var(--text); font: inherit; outline: none; min-width: 0;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  #search { width: 200px; }

  .scroll { flex: 1; overflow: auto; overflow-x: hidden; padding: 52px 0 24px; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-2);
       padding: 10px 12px 6px; background: var(--pane); white-space: nowrap; }
  td { padding: 8px 12px; border-top: 1px solid var(--sep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 20px; }
  th:last-child, td:last-child { padding-right: 14px; text-align: right; text-overflow: clip; }
  tbody tr:hover { background: var(--hover); }
  tr.clickable:active { background: var(--sel); }
  .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .name-text { min-width: 0; display: flex; flex-direction: column; }
  .name-text b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .name-text small { font: 11px ui-monospace, Menlo, monospace; color: var(--text-3); }
  a.port { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.port:hover { text-decoration: underline; }

  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
  .badge.running { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .badge.exited, .badge.created { color: var(--text-2); background: var(--sel); }
  .badge.paused, .badge.restarting { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .badge.dead { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .status-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .status-cell { min-width: 0; }
  .status-cell small { font-size: 11px; color: var(--text-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- buttons ---------- */
  .btn {
    all: unset; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; min-width: 26px;
    padding: 0 10px; border-radius: 7px; font-weight: 500; color: var(--text); box-sizing: border-box; white-space: nowrap;
    transition: transform 100ms ease-out, background-color .15s, color .15s;
  }
  .btn:hover { background: var(--sel); }
  .btn:active { transform: scale(.96); background: var(--sel); }
  .btn:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  .btn.bordered { border: 1px solid var(--sep); background: var(--card); }
  .btn.bordered:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn.icon { padding: 0; width: 26px; color: var(--text-2); }
  .btn.icon:hover { color: var(--text); }
  .btn.danger:hover { color: var(--red); }
  .btn.icon[aria-pressed="true"], .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .actions { display: inline-flex; gap: 2px; }

  .empty { text-align: center; padding: 90px 20px; color: var(--text-2); }
  .empty h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--text); margin: 0 0 4px; }
  .empty p { margin: 0 0 16px; }

  /* ---------- container detail ---------- */
  #detail { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 52px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 12px 20px 14px; font-size: 12px; }
  .meta-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .meta-item > span:first-child { color: var(--text-3); }
  .copyable { cursor: pointer; border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
  .copyable:hover { background: var(--sel); }

  .tabs-row { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 20px 12px; border-bottom: 1px solid var(--sep); }
  .segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sel); }
  .segmented button {
    all: unset; height: 22px; padding: 0 14px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-2);
    transition: background-color .15s, color .15s;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }
  .tab-tools { display: flex; align-items: center; gap: 2px; margin-left: auto; min-width: 0; }
  .tab-tools > * { flex: none; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap .field { width: 210px; padding-right: 64px; }
  .search-wrap { margin-right: 2px; }
  .search-wrap .count { position: absolute; right: 9px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; pointer-events: none; }
  select.field { padding: 4px 8px; appearance: auto; }
  .divider { width: 1px; height: 16px; background: var(--sep); margin: 0 4px; }

  .panel { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }

  /* logs */
  .log-body {
    flex: 1; min-height: 0; overflow: auto; background: var(--well); padding: 8px 0 12px;
    font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: text; cursor: text;
  }
  .ln { display: flex; padding: 0 20px 0 0; white-space: pre; }
  .ln:hover { background: var(--hover); }
  .ln .ts { flex: none; width: 104px; padding-left: 20px; color: var(--text-3); user-select: none; }
  .ln .msg { flex: 1; min-width: 0; padding-left: 8px; border-left: 2px solid transparent; }
  .ln.err .msg { border-left-color: color-mix(in srgb, var(--red) 70%, transparent); }
  .ln.sys .msg { color: var(--text-3); font-style: italic; }
  .log-body.no-ts .ts { display: none; }
  .log-body.no-ts .msg { padding-left: 18px; }
  .log-body.wrap .ln { white-space: pre-wrap; word-break: break-all; }
  ::highlight(log-match) { background-color: var(--hl); color: inherit; }
  ::highlight(log-current) { background-color: var(--hl-cur); color: inherit; }
  .a-b { font-weight: 700; } .a-d { opacity: .65; } .a-i { font-style: italic; } .a-u { text-decoration: underline; }
  .a-30,.a-90 { color: var(--text-2); } .a-31,.a-91 { color: var(--red); } .a-32,.a-92 { color: var(--green); }
  .a-33,.a-93 { color: var(--amber); } .a-34,.a-94 { color: var(--accent); } .a-35,.a-95 { color: #bf5af2; }
  .a-36,.a-96 { color: #30b0c7; } .a-37,.a-97 { color: var(--text); }

  .log-foot { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 20px; border-top: 1px solid var(--sep); font-size: 11px; color: var(--text-2); }
  .log-foot .dot { width: 6px; height: 6px; box-shadow: none; }
  .jump {
    position: absolute; left: 50%; bottom: 40px; z-index: 2; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--accent); color: #fff; border-radius: 14px; height: 28px; padding: 0 14px; font-size: 12px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: opacity .18s, transform .3s cubic-bezier(.32,.72,0,1);
  }
  .jump.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .jump:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

  /* inspect */
  .inspect { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 14px 20px; background: var(--well);
    font: 11.5px/1.6 ui-monospace, Menlo, monospace; user-select: text; cursor: text; white-space: pre; }
  .j-k { color: var(--j-key); } .j-s { color: var(--j-str); } .j-n { color: var(--j-num); } .j-l { color: var(--j-lit); }

  /* stats */
  .stats { flex: 1; overflow: auto; padding: 18px 20px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-content: start; }
  .tile { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--sep); position: relative; }
  .tile { grid-column: span 2; }
  .tile.wide { grid-column: span 3; }
  .tile h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
  .tile .big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .big small { font-size: 13px; font-weight: 500; color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
  .tile .note { font-size: 11px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .spark { display: block; width: 100%; height: 56px; margin-top: 10px; overflow: visible; }
  .spark .grid { stroke: var(--sep); stroke-width: 1; }
  .spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
  .spark .cross { stroke: var(--text-3); stroke-width: 1; }
  .spark .pt { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .tip { position: absolute; top: 10px; right: 14px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; z-index: 9; left: 50%; bottom: 18px; max-width: 70vw; padding: 9px 14px; border-radius: 10px;
    background: rgba(40,40,42,.92); color: #fff; font-weight: 500; backdrop-filter: blur(20px);
    transform: translate(-50%, 12px); opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.32,.72,0,1); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: color-mix(in srgb, #ff3b30 92%, #000); }

  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .toast, .jump { transform: translate(-50%, 0); }
    .btn:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--pane); backdrop-filter: none; }
  }
</style>
</head>
<body>
  <aside>
    <div class="group-label">Docker</div>
    <nav id="nav">
      <button data-view="containers" aria-current="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 3v10M8 3v10M11 3v10"/></svg>
        Containers <span class="count" id="n-containers"></span>
      </button>
      <button data-view="images">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 14 5v6l-6 3.2L2 11V5z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg>
        Images <span class="count" id="n-images"></span>
      </button>
      <button data-view="volumes">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>
        Volumes <span class="count" id="n-volumes"></span>
      </button>
    </nav>
    <div class="engine">
      <div class="engine-row"><span class="dot" id="engine-dot"></span><span id="engine-label">Checking…</span></div>
      <div class="engine-meta" id="engine-meta">&nbsp;</div>
      <button class="btn primary" id="engine-btn" style="width:100%" disabled>…</button>
    </div>
  </aside>

  <main>
    <header id="header">
      <div class="head-group" id="list-head">
        <h1 id="title">Containers</h1><span class="sub" id="subtitle"></span>
        <span class="spacer"></span>
        <input type="search" class="field" id="search" placeholder="Search" spellcheck="false">
      </div>
      <div class="head-group" id="detail-head" hidden></div>
    </header>

    <div class="scroll" id="scroll"><div id="content"></div></div>

    <section id="detail" hidden>
      <div class="meta" id="d-meta"></div>
      <div class="tabs-row">
        <div class="segmented" role="tablist" id="tabs">
          <button role="tab" data-tab="logs" aria-selected="true">Logs</button>
          <button role="tab" data-tab="inspect">Inspect</button>
          <button role="tab" data-tab="stats">Stats</button>
        </div>
        <div class="tab-tools" id="tools-logs">
          <div class="search-wrap">
            <input type="search" class="field" id="log-search" placeholder="Filter logs" spellcheck="false">
            <span class="count" id="log-count"></span>
          </div>
          <button class="btn icon" id="log-prev" title="Previous match (⇧↩)" aria-label="Previous match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10l4-4 4 4"/></svg></button>
          <button class="btn icon" id="log-next" title="Next match (↩)" aria-label="Next match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg></button>
          <button class="btn icon" id="log-only" aria-pressed="false" title="Show matching lines only" aria-label="Matching lines only"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z"/></svg></button>
          <span class="divider"></span>
          <select class="field" id="log-tail" title="Lines to load">
            <option value="200">200 lines</option><option value="1000" selected>1,000 lines</option>
            <option value="5000">5,000 lines</option><option value="all">All lines</option>
          </select>
          <button class="btn icon" id="log-ts" aria-pressed="true" title="Show timestamps" aria-label="Timestamps"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.8"/><path d="M8 4.8V8l2.2 1.6"/></svg></button>
          <button class="btn icon" id="log-wrap" aria-pressed="false" title="Wrap long lines" aria-label="Wrap lines"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h9a2 2 0 0 1 0 4H8m1.5-1.6L8 12l1.5 1.6M2.5 12h3"/></svg></button>
          <span class="divider"></span>
          <button class="btn icon" id="log-copy" title="Copy visible lines" aria-label="Copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg></button>
          <button class="btn icon" id="log-save" title="Save to file" aria-label="Save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg></button>
          <button class="btn icon" id="log-clear" title="Clear view" aria-label="Clear"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></svg></button>
        </div>
        <div class="tab-tools" id="tools-inspect" hidden>
          <button class="btn" id="inspect-copy">Copy JSON</button>
        </div>
      </div>

      <div class="panel" id="panel-logs">
        <div class="log-body" id="log-body" tabindex="0"></div>
        <button class="btn jump" id="log-jump">Jump to latest</button>
        <div class="log-foot"><span class="dot" id="log-dot"></span><span id="log-status">Connecting…</span><span class="spacer"></span><span class="num" id="log-lines"></span></div>
      </div>
      <div class="panel" id="panel-inspect" hidden><pre class="inspect" id="inspect-body"></pre></div>
      <div class="panel" id="panel-stats" hidden><div class="stats" id="stats-body"></div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const jsonLines = (out) => out.split('\n').filter(Boolean).map((l) => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
// Only touch the DOM when markup changed, so a click landing mid-refresh isn't swallowed.
const setHTML = (el, html) => { if (el._html !== html) { el._html = html; el.innerHTML = html; } };
const short = (id) => String(id || '').replace('sha256:', '').slice(0, 12);

const ICON = {
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7.5-4.5z"/></svg>',
  stop: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>',
  restart: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>',
  logs: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h10M3 12h6"/></svg>',
  trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>',
  back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3 5 8l5 5"/></svg>',
  chevron: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
  spin: '<svg class="spin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2a6 6 0 1 0 6 6"/></svg>',
};

const state = {
  view: 'containers', engine: null, containers: [], images: [], volumes: [], stats: {}, history: {},
  busy: new Set(), filter: '', detail: null, tab: 'logs',
};

let toastTimer;
function toast(msg, err = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = 'toast' + (err ? ' err' : '')), err ? 5000 : 2000);
}
const copy = (text, what = 'Copied') => navigator.clipboard.writeText(text).then(() => toast(what));

const docker = (...args) => window.cli.run('docker', args);
const colima = (...args) => window.cli.run('colima', args);

// ---------- data ----------
async function refreshEngine() {
  const r = await colima('status', '--json');
  let info = {};
  if (r.ok) { try { info = JSON.parse(r.stdout); } catch {} }
  state.engine = r.ok ? { running: true, ...info } : { running: false, missing: /ENOENT|not found/i.test(r.stderr) };
  renderEngine();
}

async function refreshDocker() {
  if (!state.engine?.running) { state.containers = state.images = state.volumes = []; render(); return; }
  const [c, i, v] = await Promise.all([
    docker('ps', '-a', '--format', '{{json .}}'),
    docker('images', '--format', '{{json .}}'),
    docker('volume', 'ls', '--format', '{{json .}}'),
  ]);
  state.containers = c.ok ? jsonLines(c.stdout) : [];
  state.images = i.ok ? jsonLines(i.stdout) : [];
  state.volumes = v.ok ? jsonLines(v.stdout) : [];
  render();
}

const toBytes = (s) => {
  const m = String(s).trim().match(/^([\d.]+)\s*([kKMGT]?i?B)?$/);
  if (!m) return 0;
  const u = { B: 1, kB: 1e3, KB: 1e3, KiB: 1024, MB: 1e6, MiB: 1024 ** 2, GB: 1e9, GiB: 1024 ** 3, TB: 1e12, TiB: 1024 ** 4 }[m[2] || 'B'] || 1;
  return parseFloat(m[1]) * u;
};

async function refreshStats() {
  if (!state.engine?.running || !state.containers.some((c) => c.State === 'running')) return;
  const r = await docker('stats', '--no-stream', '--format', '{{json .}}');
  if (!r.ok) return;
  const now = Date.now();
  state.stats = {};
  for (const s of jsonLines(r.stdout)) {
    const id = short(s.ID);
    state.stats[id] = s;
    const h = (state.history[id] ||= []);
    h.push({ t: now, cpu: parseFloat(s.CPUPerc) || 0, mem: toBytes(s.MemUsage.split(' / ')[0]) });
    if (h.length > 60) h.shift();
  }
  if (state.view === 'containers' && !state.detail) render();
  if (state.detail && state.tab === 'stats') renderStats();
}

// ---------- actions ----------
async function act(key, fn, okMsg) {
  state.busy.add(key); render();
  const r = await fn();
  state.busy.delete(key);
  if (r.ok) { if (okMsg) toast(okMsg); } else toast(r.stderr.trim().split('\n').pop() || 'Command failed', true);
  await refreshDocker();
}

const actions = {
  start: (id, name) => act(id, () => docker('start', id), `Started ${name}`),
  stop: (id, name) => act(id, () => docker('stop', id), `Stopped ${name}`),
  restart: (id, name) => act(id, () => docker('restart', id), `Restarted ${name}`),
  rm: async (id, name) => {
    if (!confirm(`Delete container “${name}”?`)) return;
    if (state.detail?.id === id) closeDetail();
    act(id, () => docker('rm', '-f', id), `Deleted ${name}`);
  },
  rmi: (id, name) => confirm(`Delete image “${name}”?`) && act(id, () => docker('rmi', id), `Deleted ${name}`),
  rmv: (id, name) => confirm(`Delete volume “${name}”? Its data cannot be recovered.`) && act(id, () => docker('volume', 'rm', id), `Deleted ${name}`),
  detail: (id) => openDetail(id),
  back: () => closeDetail(),
  open: (url) => window.open(url),
  copy: (text) => copy(text, 'Copied to clipboard'),
  engineToggle: () => $('engine-btn').click(),
};

$('engine-btn').addEventListener('click', async () => {
  const running = state.engine?.running;
  const btn = $('engine-btn');
  btn.disabled = true; btn.textContent = running ? 'Stopping…' : 'Starting…';
  $('engine-dot').className = 'dot busy';
  $('engine-label').textContent = running ? 'Stopping' : 'Starting';
  const r = await colima(running ? 'stop' : 'start');
  if (!r.ok) toast(r.stderr.trim().split('\n').pop() || 'Colima failed', true);
  await refreshEngine(); await refreshDocker();
});

// ---------- logs ----------
const MAX_LINES = 20000;
const logs = { lines: [], partial: { out: '', err: '' }, lastTs: null, streaming: false, follow: true, unseen: 0, matches: [], cur: -1 };
const ANSI_RE = /\x1b\[([\d;]*)m/g;
const OTHER_ESC = /\x1b\[[\d;?]*[A-Za-ln-z]|\x1b\][^\x07]*\x07|\r/g;

function ansiToHtml(raw) {
  const s = raw.replace(OTHER_ESC, '');
  let out = '', last = 0, cls = new Set(), m;
  const open = () => (cls.size ? `<span class="${[...cls].join(' ')}">` : '');
  ANSI_RE.lastIndex = 0;
  let depth = 0;
  while ((m = ANSI_RE.exec(s))) {
    out += esc(s.slice(last, m.index));
    last = ANSI_RE.lastIndex;
    for (const code of (m[1] || '0').split(';').map(Number)) {
      if (code === 0) cls.clear();
      else if (code === 1) cls.add('a-b'); else if (code === 2) cls.add('a-d');
      else if (code === 3) cls.add('a-i'); else if (code === 4) cls.add('a-u');
      else if (code === 22) { cls.delete('a-b'); cls.delete('a-d'); }
      else if (code === 39) [...cls].filter((c) => /a-\d\d/.test(c)).forEach((c) => cls.delete(c));
      else if ((code >= 30 && code <= 37) || (code >= 90 && code <= 97)) {
        [...cls].filter((c) => /a-\d\d/.test(c)).forEach((c) => cls.delete(c)); cls.add('a-' + code);
      }
    }
    out += '</span>'.repeat(depth); depth = 0;
    const o = open(); if (o) { out += o; depth = 1; }
  }
  return out + esc(s.slice(last)) + '</span>'.repeat(depth);
}

const fmtTime = (iso) => {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
};

function makeLine(stream, raw, sys = false) {
  let ts = '', msg = raw;
  const m = !sys && raw.match(/^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z) ?(.*)$/s);
  if (m) { ts = m[1]; msg = m[2]; logs.lastTs = ts; }
  const el = document.createElement('div');
  el.className = 'ln' + (stream === 'err' ? ' err' : '') + (sys ? ' sys' : '');
  el.innerHTML = `<span class="ts" title="${esc(ts)}">${esc(ts ? fmtTime(ts) : '')}</span><span class="msg">${sys ? esc(msg) : ansiToHtml(msg)}</span>`;
  const text = el.lastChild.textContent;
  return { el, ts, text, lower: text.toLowerCase() };
}

function appendLines(newLines) {
  if (!newLines.length) return;
  const body = $('log-body');
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 30;
  const frag = document.createDocumentFragment();
  const q = logQuery();
  for (const l of newLines) {
    if (q && $('log-only').getAttribute('aria-pressed') === 'true' && !l.lower.includes(q)) l.el.hidden = true;
    frag.appendChild(l.el);
    logs.lines.push(l);
  }
  body.appendChild(frag);
  if (logs.lines.length > MAX_LINES) logs.lines.splice(0, logs.lines.length - MAX_LINES).forEach((l) => l.el.remove());
  if (atBottom || logs.follow) { body.scrollTop = body.scrollHeight; logs.unseen = 0; }
  else { logs.unseen += newLines.length; }
  updateJump();
  if (q) scheduleSearch(false);
  $('log-lines').textContent = `${logs.lines.length.toLocaleString()} lines`;
}

window.cli.logs.onData((stream, text) => {
  if (!state.detail) return;
  const chunk = logs.partial[stream] + text;
  const parts = chunk.split('\n');
  logs.partial[stream] = parts.pop();
  appendLines(parts.map((p) => makeLine(stream, p)));
  setStreamStatus(true);
});
window.cli.logs.onEnd(() => {
  for (const s of ['out', 'err']) if (logs.partial[s]) { appendLines([makeLine(s, logs.partial[s])]); logs.partial[s] = ''; }
  setStreamStatus(false);
});

function setStreamStatus(on) {
  logs.streaming = on;
  $('log-dot').className = 'dot' + (on ? ' on' : '');
  $('log-status').textContent = on ? 'Streaming' : 'Not streaming — container stopped';
}

function startLogs(opts) {
  logs.partial = { out: '', err: '' };
  $('log-status').textContent = 'Connecting…';
  window.cli.logs.start(state.detail.id, opts);
  logs.streaming = true; // optimistic; corrected by onEnd if the container isn't running
}

function resetLogs() {
  logs.lines = []; logs.lastTs = null; logs.unseen = 0; logs.follow = true; logs.matches = []; logs.cur = -1;
  $('log-body').replaceChildren(); $('log-lines').textContent = ''; updateJump(); updateMatchCount();
  const t = $('log-tail').value;
  startLogs({ tail: t === 'all' ? 'all' : Number(t) });
}

function updateJump() {
  const show = !logs.follow;
  $('log-jump').classList.toggle('show', show);
  $('log-jump').textContent = logs.unseen ? `${logs.unseen.toLocaleString()} new line${logs.unseen === 1 ? '' : 's'} ↓` : 'Jump to latest ↓';
}

$('log-body').addEventListener('scroll', (e) => {
  const b = e.target;
  logs.follow = b.scrollHeight - b.scrollTop - b.clientHeight < 30;
  if (logs.follow) logs.unseen = 0;
  updateJump();
});
$('log-jump').addEventListener('click', () => {
  const b = $('log-body'); b.scrollTop = b.scrollHeight; logs.follow = true; logs.unseen = 0; updateJump();
});

// search: highlight with the CSS Custom Highlight API, optionally hide non-matching lines
const logQuery = () => $('log-search').value.trim().toLowerCase();
let searchRaf = 0;
function scheduleSearch(jump) { cancelAnimationFrame(searchRaf); searchRaf = requestAnimationFrame(() => runSearch(jump)); }

function runSearch(jump) {
  const q = logQuery(), only = $('log-only').getAttribute('aria-pressed') === 'true';
  const ranges = [];
  for (const l of logs.lines) {
    const hit = q && l.lower.includes(q);
    l.el.hidden = !!(q && only && !hit);
    if (!hit || ranges.length > 5000) continue;
    const walker = document.createTreeWalker(l.el.lastChild, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      const t = node.data.toLowerCase();
      for (let i = t.indexOf(q); i !== -1; i = t.indexOf(q, i + q.length)) {
        const r = new Range(); r.setStart(node, i); r.setEnd(node, i + q.length); ranges.push(r);
      }
    }
  }
  logs.matches = ranges;
  if (logs.cur >= ranges.length) logs.cur = ranges.length - 1;
  if (jump) logs.cur = ranges.length ? ranges.length - 1 : -1; // newest match first, like a terminal
  CSS.highlights.set('log-match', new Highlight(...ranges));
  paintCurrent(jump);
  updateMatchCount();
}

function paintCurrent(scroll) {
  const r = logs.matches[logs.cur];
  CSS.highlights.set('log-current', r ? new Highlight(r) : new Highlight());
  if (r && scroll) {
    const el = r.startContainer.parentElement.closest('.ln');
    el.scrollIntoView({ block: 'center' });
  }
}

function updateMatchCount() {
  const q = logQuery();
  $('log-count').textContent = q ? (logs.matches.length ? `${logs.cur + 1} of ${logs.matches.length.toLocaleString()}` : 'No matches') : '';
}

function step(dir) {
  if (!logs.matches.length) return;
  logs.cur = (logs.cur + dir + logs.matches.length) % logs.matches.length;
  paintCurrent(true); updateMatchCount();
}

$('log-search').addEventListener('input', () => scheduleSearch(true));
$('log-search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? 1 : -1); }
  if (e.key === 'Escape' && e.target.value) { e.stopPropagation(); e.target.value = ''; scheduleSearch(false); }
});
$('log-prev').addEventListener('click', () => step(-1));
$('log-next').addEventListener('click', () => step(1));

const toggle = (btn, fn) => btn.addEventListener('click', () => {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', on); fn(on);
});
toggle($('log-only'), () => scheduleSearch(false));
toggle($('log-ts'), (on) => $('log-body').classList.toggle('no-ts', !on));
toggle($('log-wrap'), (on) => $('log-body').classList.toggle('wrap', on));
$('log-tail').addEventListener('change', resetLogs);
$('log-clear').addEventListener('click', () => {
  logs.lines = []; logs.matches = []; logs.cur = -1; $('log-body').replaceChildren();
  $('log-lines').textContent = ''; CSS.highlights.clear(); updateMatchCount();
});
const visibleText = () => logs.lines.filter((l) => !l.el.hidden)
  .map((l) => ($('log-ts').getAttribute('aria-pressed') === 'true' && l.ts ? l.ts + ' ' : '') + l.text).join('\n');
$('log-copy').addEventListener('click', () => copy(visibleText(), 'Logs copied'));
$('log-save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([visibleText() + '\n'], { type: 'text/plain' }));
  a.download = `${state.detail.name}-${new Date().toISOString().slice(0, 19).replace(/:/g, '')}.log`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// ---------- inspect ----------
function highlightJson(json) {
  return esc(json).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)/gi,
    (m, str, colon, lit, num) => str ? `<span class="${colon ? 'j-k' : 'j-s'}">${str}</span>${colon || ''}` : lit ? `<span class="j-l">${lit}</span>` : `<span class="j-n">${num}</span>`);
}
let inspectJson = '';
async function loadInspect() {
  $('inspect-body').textContent = 'Loading…';
  const r = await docker('inspect', state.detail.id);
  if (!r.ok) { $('inspect-body').textContent = r.stderr; return; }
  try { inspectJson = JSON.stringify(JSON.parse(r.stdout)[0], null, 2); } catch { inspectJson = r.stdout; }
  $('inspect-body').innerHTML = highlightJson(inspectJson);
}
$('inspect-copy').addEventListener('click', () => copy(inspectJson, 'JSON copied'));

// ---------- stats ----------
const fmtBytes = (b) => {
  if (!b) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.min(u.length - 1, Math.floor(Math.log(b) / Math.log(1024)));
  return `${(b / 1024 ** i).toFixed(i ? 1 : 0)} ${u[i]}`;
};

function sparkline(points, key, fmt, maxHint) {
  if (points.length < 2) return '<div class="note">Collecting samples…</div>';
  const W = 300, H = 56, max = Math.max(maxHint || 0, ...points.map((p) => p[key])) * 1.1 || 1;
  const xy = points.map((p, i) => [(i / (points.length - 1)) * W, H - (p[key] / max) * H]);
  const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-key="${key}" data-fmt="${fmt}">
    <line class="grid" x1="0" x2="${W}" y1="${H}" y2="${H}" vector-effect="non-scaling-stroke"/>
    <path class="area" d="${line}L${W},${H}L0,${H}Z"/>
    <path class="line" d="${line}" vector-effect="non-scaling-stroke"/>
    <line class="cross" y1="0" y2="${H}" vector-effect="non-scaling-stroke" visibility="hidden"/>
  </svg>`;
}

function renderStats() {
  const id = short(state.detail.id), s = state.stats[id], h = state.history[id] || [];
  const c = state.containers.find((x) => x.ID === state.detail.id);
  if (!c || c.State !== 'running' || !s) {
    $('stats-body').innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>${c?.State === 'running' ? 'Collecting stats…' : 'Container isn’t running'}</h2><p>${c?.State === 'running' ? 'The first sample arrives within a few seconds.' : 'Start it to see live resource usage.'}</p></div>`;
    return;
  }
  const [memUsed, memLimit] = s.MemUsage.split(' / ');
  const [netIn, netOut] = s.NetIO.split(' / ');
  const [blkIn, blkOut] = s.BlockIO.split(' / ');
  $('stats-body').innerHTML = `
    <div class="tile wide"><h4>CPU</h4><span class="tip" data-tip></span>
      <div class="big">${esc(parseFloat(s.CPUPerc).toFixed(1))}<small>%</small></div>
      <div class="note">Last ${h.length} samples · 5 s interval</div>${sparkline(h, 'cpu', 'pct')}</div>
    <div class="tile wide"><h4>Memory</h4><span class="tip" data-tip></span>
      <div class="big">${esc(memUsed)}<small>of ${esc(memLimit)}</small></div>
      <div class="note">${esc(s.MemPerc)} of limit</div>${sparkline(h, 'mem', 'bytes')}</div>
    <div class="tile"><h4>Network I/O</h4><div class="big" style="font-size:20px">${esc(netIn)}<small>in</small></div><div class="note">${esc(netOut)} out</div></div>
    <div class="tile"><h4>Disk I/O</h4><div class="big" style="font-size:20px">${esc(blkIn)}<small>read</small></div><div class="note">${esc(blkOut)} written</div></div>
    <div class="tile"><h4>Processes</h4><div class="big" style="font-size:20px">${esc(s.PIDs)}</div><div class="note">PIDs</div></div>`;
}

// crosshair + readout for sparklines
$('stats-body').addEventListener('mousemove', (e) => {
  const svg = e.target.closest('.spark'); if (!svg) return;
  const h = state.history[short(state.detail.id)] || [];
  const rect = svg.getBoundingClientRect();
  const i = Math.round(((e.clientX - rect.left) / rect.width) * (h.length - 1));
  const p = h[Math.max(0, Math.min(h.length - 1, i))]; if (!p) return;
  const x = (i / (h.length - 1)) * 300;
  const cross = svg.querySelector('.cross');
  cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('visibility', 'visible');
  const v = svg.dataset.fmt === 'pct' ? `${p.cpu.toFixed(1)}%` : fmtBytes(p.mem);
  svg.closest('.tile').querySelector('[data-tip]').textContent = `${new Date(p.t).toLocaleTimeString([], { hour12: false })} · ${v}`;
});
$('stats-body').addEventListener('mouseout', (e) => {
  const svg = e.target.closest('.spark'); if (!svg || svg.contains(e.relatedTarget)) return;
  svg.querySelector('.cross').setAttribute('visibility', 'hidden');
  svg.closest('.tile').querySelector('[data-tip]').textContent = '';
});

// ---------- detail view ----------
function openDetail(id) {
  const c = state.containers.find((x) => x.ID === id); if (!c) return;
  state.detail = { id, name: c.Names, wasRunning: c.State === 'running' };
  $('log-search').value = ''; CSS.highlights.clear();
  setTab('logs');
  $('scroll').hidden = true; $('list-head').hidden = true;
  $('detail').hidden = false; $('detail-head').hidden = false;
  $('header').classList.add('scrolled');
  resetLogs();
  render();
  refreshStats();
}

function closeDetail() {
  if (!state.detail) return;
  window.cli.logs.stop();
  state.detail = null; CSS.highlights.clear();
  $('detail').hidden = true; $('detail-head').hidden = true;
  $('scroll').hidden = false; $('list-head').hidden = false;
  $('header').classList.toggle('scrolled', $('scroll').scrollTop > 0);
  render();
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === tab));
  for (const t of ['logs', 'inspect', 'stats']) $('panel-' + t).hidden = t !== tab;
  $('tools-logs').hidden = tab !== 'logs'; $('tools-inspect').hidden = tab !== 'inspect';
  if (tab === 'inspect') loadInspect();
  if (tab === 'stats') renderStats();
}
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });

function renderDetail() {
  const d = state.detail, c = state.containers.find((x) => x.ID === d.id);
  if (!c) { closeDetail(); return; }
  const on = c.State === 'running', busy = state.busy.has(c.ID), args = [c.ID, c.Names];
  const ab = (action, icon, label, cls = '') => `<button class="btn bordered ${cls}" data-action="${action}" data-args='${esc(JSON.stringify(args))}'>${icon}${label}</button>`;
  setHTML($('detail-head'), `
    <button class="btn icon" data-action="back" data-args="[]" title="Back to Containers (Esc)" aria-label="Back">${ICON.back}</button>
    <span class="dot ${busy ? 'busy' : on ? 'on' : ''}"></span>
    <h1>${esc(c.Names)}</h1><span class="sub">${esc(c.Image)}</span>
    <span class="spacer"></span>
    ${busy ? `<span class="btn">${ICON.spin}Working…</span>` :
      (on ? ab('stop', ICON.stop, 'Stop') + ab('restart', ICON.restart, 'Restart') : ab('start', ICON.play, 'Start')) +
      ab('rm', ICON.trash, 'Delete', 'danger')}`);
  setHTML($('d-meta'), `
    <span class="meta-item">${statusBadge(c)}<span class="muted">${esc(statusDetail(c.Status))}</span></span>
    <span class="meta-item"><span>ID</span><span class="mono copyable" title="Copy full ID" data-action="copy" data-args='${esc(JSON.stringify([c.ID]))}'>${esc(short(c.ID))}</span></span>
    <span class="meta-item"><span>Ports</span>${ports(c.Ports)}</span>
    <span class="meta-item"><span>Created</span><span class="muted">${esc(c.RunningFor)}</span></span>`);
  // Reconnect the stream when the container comes back (e.g. after Restart), picking up where we left off.
  if (on && !logs.streaming && !busy) {
    appendLines([makeLine('out', '— container started —', true)]);
    startLogs(logs.lastTs ? { since: logs.lastTs } : { tail: 200 });
  }
  if (!on && d.wasRunning) appendLines([makeLine('out', '— container stopped —', true)]);
  d.wasRunning = on;
}

// ---------- render ----------
function renderEngine() {
  const e = state.engine, dot = $('engine-dot'), btn = $('engine-btn');
  btn.disabled = !!e?.missing;
  if (e?.missing) {
    dot.className = 'dot'; $('engine-label').textContent = 'Colima not found';
    $('engine-meta').textContent = 'brew install colima docker'; btn.textContent = 'Unavailable';
  } else if (e?.running) {
    dot.className = 'dot on'; $('engine-label').textContent = 'Engine running';
    const mem = e.memory ? `${Math.round(e.memory / 1024 ** 3)} GB` : '';
    $('engine-meta').textContent = [e.cpu && `${e.cpu} CPU`, mem, e.arch].filter(Boolean).join(' · ') || ' ';
    btn.textContent = 'Stop'; btn.classList.remove('primary');
  } else {
    dot.className = 'dot'; $('engine-label').textContent = 'Engine stopped';
    $('engine-meta').textContent = ' '; btn.textContent = 'Start'; btn.classList.add('primary');
  }
}

const btn = (action, args, icon, label, extra = '') =>
  `<button class="btn icon ${extra}" title="${label}" aria-label="${label}" data-action="${action}" data-args='${esc(JSON.stringify(args))}'>${icon}</button>`;

function ports(str) {
  // "0.0.0.0:8080->80/tcp, :::8080->80/tcp" -> unique clickable host ports
  const seen = new Set();
  return (str || '').split(',').map((p) => p.trim().match(/:(\d+)->(\d+)\/(\w+)/)).filter(Boolean)
    .filter((m) => !seen.has(m[1]) && seen.add(m[1]))
    .map((m) => `<a class="port" data-action="open" data-args='${esc(JSON.stringify([`http://localhost:${m[1]}`]))}'>${m[1]}:${m[2]}</a>`).join(', ') || '<span class="muted">—</span>';
}

function statusBadge(c) {
  const st = (c.State || '').toLowerCase();
  const label = st === 'exited' ? `Exited${(c.Status.match(/\((\d+)\)/) || [])[1] ? ` (${c.Status.match(/\((\d+)\)/)[1]})` : ''}` : st[0]?.toUpperCase() + st.slice(1);
  return `<span class="badge ${esc(st)}">${esc(label)}</span>`;
}
// "Up 59 minutes (healthy)" -> "59 minutes · healthy"; "Exited (0) 9 minutes ago" -> "9 minutes ago"
const statusDetail = (s) => s.replace(/^Up\s+/, '').replace(/^Exited \(\d+\)\s*/, '').replace(/\s*\((\w+)\)$/, ' · $1');

const match = (...fields) => !state.filter || fields.some((f) => String(f ?? '').toLowerCase().includes(state.filter));

function emptyView(title, text, withStart) {
  return `<div class="empty"><h2>${title}</h2><p>${text}</p>${withStart ? '<button class="btn primary" data-action="engineToggle" data-args="[]">Start Colima</button>' : ''}</div>`;
}

const VIEWS = {
  containers() {
    const rows = state.containers.filter((c) => match(c.Names, c.Image, c.ID));
    $('subtitle').textContent = `${state.containers.filter((c) => c.State === 'running').length} running · ${state.containers.length} total`;
    if (!rows.length) return emptyView(state.filter ? 'No matches' : 'No containers', state.filter ? 'Try a different search.' : 'Run <span class="mono">docker run</span> to create one.');
    return `<table><thead><tr><th style="width:22%">Name</th><th style="width:15%">Image</th><th style="width:11%">Port(s)</th><th style="width:8%">CPU</th><th style="width:9%">Memory</th><th>Status</th><th style="width:128px"></th></tr></thead><tbody>${rows.map((c) => {
      const on = c.State === 'running', busy = state.busy.has(c.ID), s = state.stats[short(c.ID)], a = [c.ID, c.Names];
      return `<tr class="clickable" data-action="detail" data-args='${esc(JSON.stringify([c.ID]))}'>
        <td><div class="name"><span class="dot ${busy ? 'busy' : on ? 'on' : ''}"></span><span class="name-text"><b title="${esc(c.Names)}">${esc(c.Names)}</b><small>${esc(short(c.ID))}</small></span></div></td>
        <td class="muted" title="${esc(c.Image)}">${esc(c.Image)}</td>
        <td>${ports(c.Ports)}</td>
        <td class="num muted">${on && s ? esc(s.CPUPerc) : '—'}</td>
        <td class="num muted">${on && s ? esc(s.MemUsage.split(' / ')[0]) : '—'}</td>
        <td><div class="status-cell">${statusBadge(c)}<small title="${esc(c.Status)}">${esc(statusDetail(c.Status))}</small></div></td>
        <td><span class="actions">${busy ? `<span class="btn icon">${ICON.spin}</span>` :
          (on ? btn('stop', a, ICON.stop, 'Stop') : btn('start', a, ICON.play, 'Start')) +
          (on ? btn('restart', a, ICON.restart, 'Restart') : '') +
          btn('detail', [c.ID], ICON.logs, 'Logs') +
          btn('rm', a, ICON.trash, 'Delete', 'danger')}</span></td></tr>`;
    }).join('')}</tbody></table>`;
  },
  images() {
    const rows = state.images.filter((i) => match(i.Repository, i.Tag, i.ID));
    $('subtitle').textContent = `${state.images.length} images`;
    if (!rows.length) return emptyView(state.filter ? 'No matches' : 'No images', state.filter ? 'Try a different search.' : 'Pull one with <span class="mono">docker pull</span>.');
    const used = new Set(state.containers.map((c) => c.Image));
    return `<table><thead><tr><th style="width:34%">Name</th><th style="width:14%">Tag</th><th style="width:16%">Image ID</th><th>Created</th><th style="width:10%">Size</th><th style="width:56px"></th></tr></thead><tbody>${rows.map((i) => {
      const ref = i.Repository === '<none>' ? i.ID : `${i.Repository}:${i.Tag}`, inUse = used.has(ref) || used.has(i.Repository);
      return `<tr>
        <td><div class="name"><span class="dot ${inUse ? 'on' : ''}" title="${inUse ? 'In use' : 'Unused'}"></span><span class="name-text"><b title="${esc(i.Repository)}">${esc(i.Repository)}</b></span></div></td>
        <td class="muted">${esc(i.Tag)}</td><td class="mono muted">${esc(short(i.ID))}</td>
        <td class="muted">${esc(i.CreatedSince)}</td><td class="num muted">${esc(i.Size)}</td>
        <td><span class="actions">${state.busy.has(ref) ? `<span class="btn icon">${ICON.spin}</span>` : btn('rmi', [ref, ref], ICON.trash, 'Delete', 'danger')}</span></td></tr>`;
    }).join('')}</tbody></table>`;
  },
  volumes() {
    const rows = state.volumes.filter((v) => match(v.Name));
    $('subtitle').textContent = `${state.volumes.length} volumes`;
    if (!rows.length) return emptyView(state.filter ? 'No matches' : 'No volumes', state.filter ? 'Try a different search.' : 'Volumes created by containers appear here.');
    return `<table><thead><tr><th style="width:38%">Name</th><th style="width:10%">Driver</th><th>Mountpoint</th><th style="width:56px"></th></tr></thead><tbody>${rows.map((v) => `<tr>
        <td><div class="name"><span class="name-text"><b title="${esc(v.Name)}">${esc(v.Name)}</b></span></div></td><td class="muted">${esc(v.Driver)}</td><td class="mono muted">${esc(v.Mountpoint)}</td>
        <td><span class="actions">${state.busy.has(v.Name) ? `<span class="btn icon">${ICON.spin}</span>` : btn('rmv', [v.Name, v.Name], ICON.trash, 'Delete', 'danger')}</span></td></tr>`).join('')}</tbody></table>`;
  },
};

function render() {
  $('n-containers').textContent = state.containers.length || '';
  $('n-images').textContent = state.images.length || '';
  $('n-volumes').textContent = state.volumes.length || '';
  if (state.detail) { renderDetail(); return; }
  $('title').textContent = state.view[0].toUpperCase() + state.view.slice(1);
  const e = state.engine;
  if (!e) { setHTML($('content'), ''); return; }
  if (!e.running) {
    $('subtitle').textContent = '';
    setHTML($('content'), e.missing
      ? emptyView('Colima isn’t installed', 'Install it with <span class="mono">brew install colima docker</span>, then reopen this app.')
      : emptyView('Engine stopped', 'Start Colima to see your containers, images and volumes.', true));
    return;
  }
  setHTML($('content'), VIEWS[state.view]());
}

// ---------- events ----------
$('nav').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  closeDetail();
  state.view = b.dataset.view;
  document.querySelectorAll('#nav button').forEach((x) => x.setAttribute('aria-current', x === b));
  $('scroll').scrollTop = 0; render();
});
// One delegated handler for every data-action in the page; buttons inside a clickable row win over the row.
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el || el.closest('nav')) return;
  if (getSelection().toString() && el.tagName === 'TR') return;
  e.stopPropagation();
  actions[el.dataset.action](...JSON.parse(el.dataset.args));
});
$('search').addEventListener('input', (e) => { state.filter = e.target.value.trim().toLowerCase(); render(); });
$('scroll').addEventListener('scroll', (e) => $('header').classList.toggle('scrolled', e.target.scrollTop > 0));
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.detail && document.activeElement !== $('log-search')) closeDetail();
  if (e.key === 'f' && e.metaKey) {
    e.preventDefault();
    const f = state.detail && state.tab === 'logs' ? $('log-search') : $('search');
    f.focus(); f.select();
  }
  if (e.key === 'k' && e.metaKey && state.detail) { e.preventDefault(); $('log-clear').click(); }
});

// Poll like Docker Desktop does; skip while the window is hidden.
async function tick() {
  if (document.hidden) return;
  await refreshEngine(); await refreshDocker();
}
tick().then(refreshStats);
setInterval(tick, 3000);
setInterval(refreshStats, 5000);
</script>
</body>
</html>
