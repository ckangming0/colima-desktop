<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Colima Desktop</title>
<style>
  :root {
    --text: rgba(0,0,0,.88); --text-2: rgba(0,0,0,.56); --text-3: rgba(0,0,0,.36);
    --sep: rgba(0,0,0,.08); --hover: rgba(0,0,0,.04); --sel: rgba(0,0,0,.07);
    --pane: #fbfbfd; --bar: rgba(251,251,253,.74); --card: #ffffff; --well: #f4f4f6;
    --accent: #0a84ff; --green: #1fa83a; --red: #e5372b; --gray: #8e8e93; --amber: #e08600;
    --hl: rgba(255, 204, 0, .45); --hl-cur: rgba(255, 149, 0, .8);
    --j-key: #9b2393; --j-str: #c41a16; --j-num: #1c00cf; --j-lit: #0b4f79;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: rgba(255,255,255,.9); --text-2: rgba(255,255,255,.58); --text-3: rgba(255,255,255,.36);
      --sep: rgba(255,255,255,.09); --hover: rgba(255,255,255,.045); --sel: rgba(255,255,255,.09);
      --pane: #1e1e20; --bar: rgba(30,30,32,.74); --card: #262628; --well: #161618;
      --green: #32d74b; --red: #ff6961; --amber: #ffb340;
      --hl: rgba(255, 214, 10, .35); --hl-cur: rgba(255, 159, 10, .75);
      --j-key: #ff7ab2; --j-str: #ff8170; --j-num: #d9c97c; --j-lit: #6bdfff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, system-ui, sans-serif; color: var(--text);
    background: transparent; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }
  [hidden] { display: none !important; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-2); }

  /* ---------- sidebar (native vibrancy behind it) ---------- */
  aside { width: 210px; flex: none; display: flex; flex-direction: column; padding: 52px 10px 12px; -webkit-app-region: drag; }
  aside nav, aside .engine { -webkit-app-region: no-drag; }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--text-3); padding: 0 10px 4px; }
  nav button {
    all: unset; display: flex; align-items: center; gap: 9px; width: 100%; box-sizing: border-box;
    padding: 6px 10px; border-radius: 7px; font-weight: 500; color: var(--text);
  }
  nav button:hover { background: var(--hover); }
  nav button[aria-current="true"] { background: var(--sel); }
  nav svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
  nav .count { margin-left: auto; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .engine { margin-top: auto; padding: 10px; border-radius: 10px; background: var(--hover); }
  .engine-row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .engine-meta { font-size: 11px; color: var(--text-2); margin: 3px 0 9px 16px; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); flex: none; transition: background-color .3s; }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
  .dot.busy { background: var(--amber); }

  /* ---------- main pane ---------- */
  main { flex: 1; min-width: 0; background: var(--pane); position: relative; display: flex; flex-direction: column; border-left: 1px solid var(--sep); }
  header {
    position: absolute; inset: 0 0 auto 0; z-index: 3; height: 52px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 20px; background: var(--bar); backdrop-filter: blur(20px) saturate(180%); -webkit-app-region: drag;
  }
  header::after { content: ""; position: absolute; inset: auto 0 -12px 0; height: 12px; pointer-events: none;
    background: linear-gradient(var(--sep), transparent); opacity: 0; transition: opacity .2s; }
  header.scrolled::after { opacity: .7; }
  header button, header input, header a { -webkit-app-region: no-drag; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sub { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spacer { flex: 1; }
  .head-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  .field {
    padding: 5px 10px; border-radius: 7px; border: 1px solid var(--sep); background: var(--hover);
    color: var(--text); font: inherit; outline: none; min-width: 0;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  #search { width: 200px; }

  .scroll { flex: 1; overflow: auto; overflow-x: hidden; padding: 52px 0 24px; }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 11px; font-weight: 600; color: var(--text-2);
       padding: 10px 12px 6px; background: var(--pane); white-space: nowrap; }
  td { padding: 8px 12px; border-top: 1px solid var(--sep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 20px; }
  th:last-child, td:last-child { padding-right: 14px; text-align: right; text-overflow: clip; }
  tbody tr:hover { background: var(--hover); }
  tr.clickable:active { background: var(--sel); }
  .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .name-text { min-width: 0; display: flex; flex-direction: column; }
  .name-text b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .name-text small { font: 11px ui-monospace, Menlo, monospace; color: var(--text-3); }
  a.port { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.port:hover { text-decoration: underline; }

  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
  .badge.running { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .badge.exited, .badge.created { color: var(--text-2); background: var(--sel); }
  .badge.paused, .badge.restarting { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .badge.dead { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .status-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .status-cell { min-width: 0; }
  .status-cell small { font-size: 11px; color: var(--text-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- buttons ---------- */
  .btn {
    all: unset; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; min-width: 26px;
    padding: 0 10px; border-radius: 7px; font-weight: 500; color: var(--text); box-sizing: border-box; white-space: nowrap;
    transition: transform 100ms ease-out, background-color .15s, color .15s;
  }
  .btn:hover { background: var(--sel); }
  .btn:active { transform: scale(.96); background: var(--sel); }
  .btn:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
  .btn.bordered { border: 1px solid var(--sep); background: var(--card); }
  .btn.bordered:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn.icon { padding: 0; width: 26px; color: var(--text-2); }
  .btn.icon:hover { color: var(--text); }
  .btn.danger:hover { color: var(--red); }
  .btn.icon[aria-pressed="true"], .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .actions { display: inline-flex; gap: 2px; }

  .empty { text-align: center; padding: 90px 20px; color: var(--text-2); }
  .empty h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--text); margin: 0 0 4px; }
  .empty p { margin: 0 0 16px; }

  /* ---------- container detail ---------- */
  #detail { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 52px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; padding: 12px 20px 14px; font-size: 12px; }
  .meta-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .meta-item > span:first-child { color: var(--text-3); }
  .copyable { cursor: pointer; border-radius: 4px; padding: 0 3px; margin: 0 -3px; }
  .copyable:hover { background: var(--sel); }

  .tabs-row { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 20px 12px; border-bottom: 1px solid var(--sep); }
  .segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sel); }
  .segmented button {
    all: unset; height: 22px; padding: 0 14px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--text-2);
    transition: background-color .15s, color .15s;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }
  .tab-tools { display: flex; align-items: center; gap: 2px; margin-left: auto; min-width: 0; }
  .tab-tools > * { flex: none; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap .field { width: 210px; padding-right: 64px; }
  .search-wrap { margin-right: 2px; }
  .search-wrap .count { position: absolute; right: 9px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; pointer-events: none; }
  select.field { padding: 4px 8px; appearance: auto; }
  .divider { width: 1px; height: 16px; background: var(--sep); margin: 0 4px; }

  .panel { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }

  /* logs */
  .log-body {
    flex: 1; min-height: 0; overflow: auto; background: var(--well); padding: 8px 0 12px;
    font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; user-select: text; cursor: text;
  }
  .ln { display: flex; padding: 0 20px 0 0; white-space: pre; }
  .ln:hover { background: var(--hover); }
  .ln .ts { flex: none; width: 104px; padding-left: 20px; color: var(--text-3); user-select: none; }
  .ln .msg { flex: 1; min-width: 0; padding-left: 8px; border-left: 2px solid transparent; }
  .ln.err .msg { border-left-color: color-mix(in srgb, var(--red) 70%, transparent); }
  .ln.sys .msg { color: var(--text-3); font-style: italic; }
  .log-body.no-ts .ts { display: none; }
  .log-body.no-ts .msg { padding-left: 18px; }
  .log-body.wrap .ln { white-space: pre-wrap; word-break: break-all; }
  ::highlight(log-match) { background-color: var(--hl); color: inherit; }
  ::highlight(log-current) { background-color: var(--hl-cur); color: inherit; }
  .a-b { font-weight: 700; } .a-d { opacity: .65; } .a-i { font-style: italic; } .a-u { text-decoration: underline; }
  .a-30,.a-90 { color: var(--text-2); } .a-31,.a-91 { color: var(--red); } .a-32,.a-92 { color: var(--green); }
  .a-33,.a-93 { color: var(--amber); } .a-34,.a-94 { color: var(--accent); } .a-35,.a-95 { color: #bf5af2; }
  .a-36,.a-96 { color: #30b0c7; } .a-37,.a-97 { color: var(--text); }

  .log-foot { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 20px; border-top: 1px solid var(--sep); font-size: 11px; color: var(--text-2); }
  .log-foot .dot { width: 6px; height: 6px; box-shadow: none; }
  .jump {
    position: absolute; left: 50%; bottom: 40px; z-index: 2; transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    background: var(--accent); color: #fff; border-radius: 14px; height: 28px; padding: 0 14px; font-size: 12px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(0,0,0,.2); transition: opacity .18s, transform .3s cubic-bezier(.32,.72,0,1);
  }
  .jump.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .jump:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

  /* inspect */
  .inspect { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 14px 20px; background: var(--well);
    font: 11.5px/1.6 ui-monospace, Menlo, monospace; user-select: text; cursor: text; white-space: pre; }
  .j-k { color: var(--j-key); } .j-s { color: var(--j-str); } .j-n { color: var(--j-num); } .j-l { color: var(--j-lit); }

  /* stats */
  .stats { flex: 1; overflow: auto; padding: 18px 20px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; align-content: start; }
  .tile { background: var(--card); border-radius: 12px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--sep); position: relative; }
  .tile { grid-column: span 2; }
  .tile.wide { grid-column: span 3; }
  .tile h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
  .tile .big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .big small { font-size: 13px; font-weight: 500; color: var(--text-2); letter-spacing: 0; margin-left: 4px; }
  .tile .note { font-size: 11px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .spark { display: block; width: 100%; height: 56px; margin-top: 10px; overflow: visible; }
  .spark .grid { stroke: var(--sep); stroke-width: 1; }
  .spark .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
  .spark .cross { stroke: var(--text-3); stroke-width: 1; }
  .spark .pt { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .tip { position: absolute; top: 10px; right: 14px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed; z-index: 9; left: 50%; bottom: 18px; max-width: 70vw; padding: 9px 14px; border-radius: 10px;
    background: rgba(40,40,42,.92); color: #fff; font-weight: 500; backdrop-filter: blur(20px);
    transform: translate(-50%, 12px); opacity: 0; transition: opacity .2s, transform .3s cubic-bezier(.32,.72,0,1); pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: color-mix(in srgb, #ff3b30 92%, #000); }

  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .toast, .jump { transform: translate(-50%, 0); }
    .btn:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--pane); backdrop-filter: none; }
  }
</style>
</head>
<body>
  <aside>
    <div class="group-label">Docker</div>
    <nav id="nav">
      <button data-view="containers" aria-current="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 3v10M8 3v10M11 3v10"/></svg>
        Containers <span class="count" id="n-containers"></span>
      </button>
      <button data-view="images">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 14 5v6l-6 3.2L2 11V5z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg>
        Images <span class="count" id="n-images"></span>
      </button>
      <button data-view="volumes">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>
        Volumes <span class="count" id="n-volumes"></span>
      </button>
    </nav>
    <div class="engine">
      <div class="engine-row"><span class="dot" id="engine-dot"></span><span id="engine-label">Checking…</span></div>
      <div class="engine-meta" id="engine-meta">&nbsp;</div>
      <button class="btn primary" id="engine-btn" style="width:100%" disabled>…</button>
    </div>
  </aside>

  <main>
    <header id="header">
      <div class="head-group" id="list-head">
        <h1 id="title">Containers</h1><span class="sub" id="subtitle"></span>
        <span class="spacer"></span>
        <input type="search" class="field" id="search" placeholder="Search" spellcheck="false">
      </div>
      <div class="head-group" id="detail-head" hidden></div>
    </header>

    <div class="scroll" id="scroll"><div id="content"></div></div>

    <section id="detail" hidden>
      <div class="meta" id="d-meta"></div>
      <div class="tabs-row">
        <div class="segmented" role="tablist" id="tabs">
          <button role="tab" data-tab="logs" aria-selected="true">Logs</button>
          <button role="tab" data-tab="inspect">Inspect</button>
          <button role="tab" data-tab="stats">Stats</button>
        </div>
        <div class="tab-tools" id="tools-logs">
          <div class="search-wrap">
            <input type="search" class="field" id="log-search" placeholder="Filter logs" spellcheck="false">
            <span class="count" id="log-count"></span>
          </div>
          <button class="btn icon" id="log-prev" title="Previous match (⇧↩)" aria-label="Previous match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10l4-4 4 4"/></svg></button>
          <button class="btn icon" id="log-next" title="Next match (↩)" aria-label="Next match"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg></button>
          <button class="btn icon" id="log-only" aria-pressed="false" title="Show matching lines only" aria-label="Matching lines only"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5z"/></svg></button>
          <span class="divider"></span>
          <select class="field" id="log-tail" title="Lines to load">
            <option value="200">200 lines</option><option value="1000" selected>1,000 lines</option>
            <option value="5000">5,000 lines</option><option value="all">All lines</option>
          </select>
          <button class="btn icon" id="log-ts" aria-pressed="true" title="Show timestamps" aria-label="Timestamps"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.8"/><path d="M8 4.8V8l2.2 1.6"/></svg></button>
          <button class="btn icon" id="log-wrap" aria-pressed="false" title="Wrap long lines" aria-label="Wrap lines"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h9a2 2 0 0 1 0 4H8m1.5-1.6L8 12l1.5 1.6M2.5 12h3"/></svg></button>
          <span class="divider"></span>
          <button class="btn icon" id="log-copy" title="Copy visible lines" aria-label="Copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg></button>
          <button class="btn icon" id="log-save" title="Save to file" aria-label="Save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13.5h10"/></svg></button>
          <button class="btn icon" id="log-clear" title="Clear view" aria-label="Clear"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></svg></button>
        </div>
        <div class="tab-tools" id="tools-inspect" hidden>
          <button class="btn" id="inspect-copy">Copy JSON</button>
        </div>
      </div>

      <div class="panel" id="panel-logs">
        <div class="log-body" id="log-body" tabindex="0"></div>
        <button class="btn jump" id="log-jump">Jump to latest</button>
        <div class="log-foot"><span class="dot" id="log-dot"></span><span id="log-status">Connecting…</span><span class="spacer"></span><span class="num" id="log-lines"></span></div>
      </div>
      <div class="panel" id="panel-inspect" hidden><pre class="inspect" id="inspect-body"></pre></div>
      <div class="panel" id="panel-stats" hidden><div class="stats" id="stats-body"></div></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

<script src="lib/format.js"></script>
<script src="renderer.js"></script>
</body>
</html>
